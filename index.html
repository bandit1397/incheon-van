<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incheon Easy Van</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#f2f4f8;
}

/* MAIN SCREEN */
.main {
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* Center Card */
.center-box {
  text-align:center;
  background:#e6e6e6;
  padding:40px;
  border-radius:20px;
  width:320px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

button {
  width:220px;
  padding:15px;
  margin:10px;
  font-size:16px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  color:#fff;
}

.arrive { background:#2d87da; }
.depart { background:#2ca243; }
.book { background:#ff7f00; }
.region-toggle { background:#6f42c1; }

/* REGION PAGE */
#regionPage {
  display:none;
  padding:30px;
  text-align:center;
}

.region-btn {
  margin:10px;
  padding:12px 20px;
  background:#1e90ff;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.category-btn {
  margin:10px;
  padding:10px 15px;
  background:#ff7f00;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.back-btn {
  margin-top:20px;
  background:red;
  padding:10px;
}

/* Popup */
.popup {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
}

.popup-content {
  background:white;
  padding:30px;
  border-radius:15px;
  width:400px;
  text-align:center;
}

/* Booking */
input {
  width:90%;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
  border:1px solid #ccc;
}

.submit-btn {
  background:#28a745;
}

.close-btn {
  background:red;
}
</style>
</head>

<body>

<!-- MAIN -->
<div class="main" id="mainPage">

  <div class="center-box">
    <h2>Welcome to Korea 🇰🇷</h2>
    <p>Easy transport from Incheon Airport</p>

    <a href="arrive.html">
      <button class="arrive">Arrive in Korea</button>
    </a>

    <a href="depart.html">
      <button class="depart">Depart from Korea</button>
    </a>

    <button class="book" onclick="openBooking()">Book Now</button>

    <!-- REGION BUTTON -->
    <button class="region-toggle" onclick="openRegionPage()">Select Region</button>

    <div id="result"></div>
  </div>

</div>

<!-- REGION PAGE -->
<div id="regionPage">

  <h2>Select Region</h2>

  <button class="region-btn" onclick="selectRegionPage('Andong')">Andong</button>
  <button class="region-btn" onclick="selectRegionPage('Seoul')">Seoul</button>
  <button class="region-btn" onclick="selectRegionPage('Incheon')">Incheon</button>

  <div id="regionContent"></div>

  <button class="back-btn" onclick="goBack()">Back</button>

</div>

<!-- BOOKING -->
<div class="popup" id="booking">
  <div class="popup-content">
    <h3>Book Your Ride 🚐</h3>

    <input type="text" id="name" placeholder="Your Name">
    <input type="text" id="pickup" placeholder="Pickup">
    <input type="text" id="dropoff" placeholder="Drop-off">
    <input type="datetime-local" id="date">
    <input type="number" id="people" placeholder="Passengers">

    <button class="submit-btn" onclick="sendBooking()">Submit</button>
    <button class="close-btn" onclick="closeBooking()">Close</button>
  </div>
</div>

<script>

/* BOOKING (기존 유지) */
function openBooking(){
  document.getElementById("booking").style.display="flex";
}

function closeBooking(){
  document.getElementById("booking").style.display="none";
}

function sendBooking(){
  let name = document.getElementById("name").value;
  let pickup = document.getElementById("pickup").value;
  let dropoff = document.getElementById("dropoff").value;
  let date = document.getElementById("date").value;
  let people = document.getElementById("people").value;

  let message = `Hello, I want to book a ride.%0AName: ${name}%0APickup: ${pickup}%0ADropoff: ${dropoff}%0ADate: ${date}%0APeople: ${people}`;

  window.open(`https://wa.me/821025963169?text=${message}`, "_blank");
}

/* REGION PAGE */
let selectedRegion = null;

const regionData = {
  Andong: {
    events:["Mask Dance Festival","Confucian Ceremony","Folk Performance"],
    nature:["Nakdong River","Buyongdae Cliff","Mountain Trails"],
    culture:["Hahoe Village","Dosan Seowon","Traditional Houses"],
    food:["Jjimdak","Heotjesabap","Salted Mackerel"],
    kpop:["Traditional Music","Local 공연","문화 체험"],
    hotels:["Hanok Stay","River Hotel","Guesthouse"]
  },
  Seoul: {
    events:["Lantern Festival","Fireworks","Street 공연"],
    nature:["Han River","Bukhansan","Namsan"],
    culture:["Gyeongbokgung","Bukchon","Insadong"],
    food:["BBQ","Tteokbokki","Bibimbap"],
    kpop:["SM Town","HYBE","Concert Hall"],
    hotels:["Lotte Hotel","Shilla","Business Hotel"]
  },
  Incheon: {
    events:["Pentaport Rock","Fireworks","Harbor Festival"],
    nature:["Songdo Park","Central Park","Beach"],
    culture:["Chinatown","Open Port","Museum"],
    food:["Jajangmyeon","Seafood","Street Food"],
    kpop:["Concert","Dance Studio","Kpop Tour"],
    hotels:["Sheraton","Holiday Inn","Airport Hotel"]
  }
};

function openRegionPage(){
  document.getElementById("mainPage").style.display="none";
  document.getElementById("regionPage").style.display="block";
}

function goBack(){
  document.getElementById("regionPage").style.display="none";
  document.getElementById("mainPage").style.display="flex";
}

function selectRegionPage(region){
  selectedRegion = region;

  let html = `<h3>${region}</h3>`;

  ["events","nature","culture","food","kpop","hotels"].forEach(cat=>{
    html += `<button class="category-btn" onclick="showRegionData('${cat}')">${cat}</button>`;
  });

  html += `<div id="detail"></div>`;

  document.getElementById("regionContent").innerHTML = html;
}

function showRegionData(type){
  let items = regionData[selectedRegion][type];

  document.getElementById("detail").innerHTML =
    `<h4>${type.toUpperCase()}</h4>` + items.join("<br>");
}

</script>

</body>
</html>
