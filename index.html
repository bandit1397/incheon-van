<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incheon Easy Van</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#f2f4f8;
}

.container {
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px;
}

/* MAIN BOX */
.center-box {
  text-align:center;
  background:#e6e6e6;
  padding:25px;
  border-radius:20px;
  width:100%;
  max-width:350px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

button {
  width:100%;
  padding:12px;
  margin:8px 0;
  font-size:16px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  color:#fff;
}

.arrive { background:#2d87da; }
.depart { background:#2ca243; }
.book { background:#ff7f00; }

/* ===== NEW CATEGORY BOX (ALL IN ONE) ===== */
.category-box {
  margin-top:15px;
  background:#ffffff;
  padding:15px;
  border-radius:20px;
  width:100%;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

/* Travel (top center) */
.category.travel {
  width:100%;
  padding:14px;
  margin-bottom:10px;
  background:#f47c4b;
  color:white;
  border-radius:15px;
  text-align:center;
  font-size:16px;
  line-height:1.3;
  white-space:normal;
  word-break:keep-all;
  cursor:pointer;
}

/* Sub categories grid */
.sub-categories {
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap:8px;
}

.category.small {
  padding:12px;
  background:#f47c4b;
  color:white;
  border-radius:12px;
  text-align:center;
  font-size:14px;
  line-height:1.3;
  white-space:normal;
  word-break:keep-all;
  cursor:pointer;
}

/* POPUP */
.popup {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
}

.popup-content {
  background:white;
  padding:20px;
  border-radius:15px;
  width:90%;
  max-width:400px;
  text-align:center;
}

input {
  width:90%;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
  border:1px solid #ccc;
}

.submit-btn { background:#28a745; }
.close-btn { background:red; margin-top:10px; }

.region-btn {
  margin:5px;
  padding:8px 10px;
  background:#1e90ff;
  color:white;
  border:none;
  border-radius:8px;
}

</style>
</head>

<body>

<div class="container">

  <!-- MAIN -->
  <div class="center-box">
    <h2>Welcome to Korea 🇰🇷</h2>
    <p>Easy transport from Incheon Airport</p>

    <a href="arrive.html"><button class="arrive">Arrive</button></a>
    <a href="depart.html"><button class="depart">Depart</button></a>
    <button class="book" onclick="openBooking()">Book Now</button>

    <!-- ALL CATEGORIES INSIDE ONE BOX -->
    <div class="category-box">

      <!-- Travel (center top) -->
      <div class="category travel" onclick="openTravel()">
        Select Travel Region
      </div>

      <!-- LEFT / RIGHT BELOW -->
      <div class="sub-categories">
        <div class="category small" onclick="showCategory('events')">Events</div>
        <div class="category small" onclick="showCategory('nature')">Nature</div>
        <div class="category small" onclick="showCategory('culture')">Culture</div>
        <div class="category small" onclick="showCategory('shopping')">Shopping</div>
        <div class="category small" onclick="showCategory('hotels')">Hotels</div>
        <div class="category small" onclick="showCategory('kpop')">K-Pop</div>
        <div class="category small" onclick="showCategory('food')">Food</div>
      </div>

    </div>

    <div id="result" style="margin-top:15px;"></div>
  </div>

</div>

<!-- POPUPS -->
<div class="popup" id="popup">
  <div class="popup-content">
    <h3>Select Region</h3>
    <button class="region-btn" onclick="selectRegion('Seoul')">Seoul</button>
    <button class="region-btn" onclick="selectRegion('Busan')">Busan</button>
    <button class="region-btn" onclick="selectRegion('Incheon')">Incheon</button>
    <br>
    <button class="close-btn" onclick="closePopup()">Close</button>
  </div>
</div>

<div class="popup" id="booking">
  <div class="popup-content">
    <h3>Book Ride 🚐</h3>
    <input id="name" placeholder="Name">
    <input id="pickup" placeholder="Pickup">
    <input id="dropoff" placeholder="Dropoff">
    <input type="datetime-local" id="date">
    <input type="number" id="people" placeholder="People">

    <button class="submit-btn" onclick="sendBooking()">Submit</button>
    <button class="close-btn" onclick="closeBooking()">Close</button>
  </div>
</div>

<script>
let currentRegion=null;

function openTravel(){
  document.getElementById("popup").style.display="flex";
}
function closePopup(){
  document.getElementById("popup").style.display="none";
}
function selectRegion(r){
  currentRegion=r;
  closePopup();
  document.getElementById("result").innerHTML="Selected: "+r;
}

function showCategory(type){
  if(!currentRegion){alert("Select region first");return;}
  document.getElementById("result").innerHTML = currentRegion+" - "+type;
}

function openBooking(){
  document.getElementById("booking").style.display="flex";
}
function closeBooking(){
  document.getElementById("booking").style.display="none";
}

function sendBooking(){
  let name=document.getElementById("name").value;
  let pickup=document.getElementById("pickup").value;
  let dropoff=document.getElementById("dropoff").value;
  let date=document.getElementById("date").value;
  let people=document.getElementById("people").value;

  let msg=`Hello%0AName:${name}%0APickup:${pickup}%0ADrop:${dropoff}%0ADate:${date}%0APeople:${people}`;
  window.open(`https://wa.me/821025963169?text=${msg}`);
}
</script>

</body>
</html>
